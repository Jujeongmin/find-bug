<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find bug</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      /* The screen before the screen: this is what is on the page between
         the HTML arriving and the first React frame. It is the same dark the
         game's own loading screen opens on, so the handover is not a flash of
         black followed by a flash of navy. */
      .loading-container {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#151824, #1d2130 60%, #262b3a);
        color: #f2e3c0;
      }
      .loading-title {
        font-size: 1.25rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        margin: 0;
        opacity: 0.85;
      }
    </style>
    <script>
      // Verse8 editor bridge: the host iframe asks the game how tall it is and
      // sizes itself from the answer. Without this the preview stays blank.
      (function () {
        function reportGameSize() {
          const height = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );

          const width = Math.max(
            document.body.scrollWidth,
            document.documentElement.scrollWidth
          );

          window.parent.postMessage(
            {
              type: 'GAME_SIZE_RESPONSE',
              height: height,
              width: width,
            },
            '*'
          );
        }

        window.addEventListener('load', reportGameSize);

        window.addEventListener('resize', reportGameSize);

        window.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'REQUEST_GAME_SIZE') {
            reportGameSize();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <h2 class="loading-title">Find bug</h2>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
