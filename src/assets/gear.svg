<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- blocky teeth so the silhouette reads as a gear at pixel-art scale -->
  <g fill="#8e97a6">
    <rect x="6" y="0" width="4" height="3"/>
    <rect x="6" y="13" width="4" height="3"/>
    <rect x="0" y="6" width="3" height="4"/>
    <rect x="13" y="6" width="3" height="4"/>
    <rect x="2" y="2" width="3" height="3"/>
    <rect x="11" y="2" width="3" height="3"/>
    <rect x="2" y="11" width="3" height="3"/>
    <rect x="11" y="11" width="3" height="3"/>
  </g>
  <circle cx="8" cy="8" r="6" fill="#8e97a6"/>
  <circle cx="8" cy="8" r="4.5" fill="#5b6472"/>
  <circle cx="8" cy="8" r="2" fill="#2b313a"/>
</svg>
